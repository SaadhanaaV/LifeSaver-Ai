<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Last-Minute Life Saver</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <div class="max-w-4xl mx-auto p-6">
        <header class="text-center my-10">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-400 mb-2">
                🚨 The Last-Minute Life Saver
            </h1>
            <p class="text-gray-400 text-lg">Turn your chaotic brain dump into an immediate, stress-free action plan.</p>
        </header>

        <main class="space-y-8">
            <section class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl">
                <label for="brainDump" class="block text-sm font-semibold text-gray-300 mb-2">
                    What are you panicking or stressed about right now?
                </label>
                <textarea id="brainDump" rows="4" 
                    class="w-full bg-gray-900 border border-gray-700 rounded-xl p-4 text-gray-100 focus:ring-2 focus:ring-orange-500 focus:outline-none placeholder-gray-500"
                    placeholder="Example: I have a massive math test tomorrow at 9 AM, I haven't studied, my room is a mess, and I forgot to pay my internet bill tonight..."></textarea>
                
                <div class="mt-4 flex gap-3">
                    <button id="triageBtn" class="flex-1 bg-gradient-to-r from-red-600 to-orange-500 hover:from-red-500 hover:to-orange-400 text-white font-bold py-3 rounded-xl transition duration-200 shadow-lg shadow-orange-900/30">
                        ⚡ Triage My Life
                    </button>
                </div>
            </section>

            <div id="loading" class="hidden text-center py-8 space-y-3">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-orange-500 mx-auto"></div>
                <p class="text-orange-400 font-medium animate-pulse">Gemini is absorbing your chaos and building a plan...</p>
            </div>

            <section id="resultsContainer" class="hidden space-y-6">
                <h2 class="text-2xl font-bold border-b border-gray-700 pb-2 text-orange-400">📋 Your Battle Plan</h2>
                <div id="planList" class="space-y-4"></div>
            </section>
        </main>
    </div>

    <script>
        document.getElementById('triageBtn').addEventListener('click', async () => {
            const brainDumpText = document.getElementById('brainDump').value;
            const loading = document.getElementById('loading');
            const resultsContainer = document.getElementById('resultsContainer');
            const planList = document.getElementById('planList');

            if (!brainDumpText.trim()) {
                alert("Please drop your stress text first!");
                return;
            }

            // Show loading spinner, hide previous results
            loading.classList.remove('hidden');
            resultsContainer.classList.add('hidden');
            planList.innerHTML = '';

            try {
                // Call your Node backend port 5000
                const response = await fetch('http://localhost:5000/api/triage', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ brainDump: brainDumpText })
                });

                const data = await response.json();
                
                // Map through the JSON tasks generated by Gemini
                data.triage_plan.forEach((task, index) => {
                    // Decide color indicator based on urgency levels
                    let badgeColor = 'bg-yellow-900/50 text-yellow-300 border-yellow-700';
                    if (task.urgency === 'CRITICAL') badgeColor = 'bg-red-900/50 text-red-300 border-red-700';
                    if (task.urgency === 'HIGH') badgeColor = 'bg-orange-900/50 text-orange-300 border-orange-700';

                    // Generate checkboxes for micro-steps
                    const stepsHTML = task.micro_steps.map(step => `
                        <label class="flex items-start gap-3 text-sm text-gray-300 cursor-pointer hover:text-white transition">
                            <input type="checkbox" class="mt-1 accent-orange-500 rounded focus:ring-0">
                            <span>${step}</span>
                        </label>
                    `).join('');

                    // Card template injection containing the active premium features
                    const cardHTML = `
                        <div id="task-card-${index}" class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-md transition duration-300">
                            <div class="space-y-2">
                                <div class="flex items-center justify-between flex-wrap gap-2">
                                    <div class="flex items-center gap-3">
                                        <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold border ${badgeColor}">${task.urgency}</span>
                                        <span class="text-sm font-medium text-gray-400">⏱️ Scheduled: ${task.time_block}</span>
                                    </div>
                                    <div id="defcon-${index}" class="text-xs font-bold px-2 py-1 rounded bg-gray-900 text-gray-400 border border-gray-700 animate-pulse">
                                        ⏳ Calculating time cushion...
                                    </div>
                                </div>
                                
                                <h3 class="text-xl font-bold text-white mt-1">${task.task_title}</h3>
                                
                                <div class="mt-3 space-y-2 bg-gray-900/40 p-3 rounded-lg border border-gray-700/50">
                                    ${stepsHTML}
                                </div>

                                <div class="mt-4 pt-3 border-t border-gray-700/50 flex justify-end">
                                    <button onclick="triggerAutonomousExecution('${task.task_title.replace(/'/g, "\\'")}')" class="text-xs bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 hover:bg-indigo-600 hover:text-white px-3 py-1.5 rounded-lg font-medium transition duration-150 flex items-center gap-1">
                                        🤖 Autonomous Delegation Draft
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    planList.insertAdjacentHTML('beforeend', cardHTML);
                    
                    // Activate the countdown logic simulation for the hackathon presentation
                    simulateDefconReminders(index);
                });

                // Display finished dashboard items
                resultsContainer.classList.remove('hidden');

            } catch (err) {
                console.error(err);
                alert("Could not connect to backend server. Make sure node server.js is running on port 5000!");
            } finally {
                loading.classList.add('hidden');
            }
        });

        // Logic to handle changing reminders as time gets critical
        function simulateDefconReminders(index) {
            const defconBadge = document.getElementById(`defcon-${index}`);
            const card = document.getElementById(`task-card-${index}`);
            
            // For presentation demo purposes, we cycle the states faster so judges see it immediately
            const states = [
                { text: "🟢 DEFCON 3: On Track", style: "text-green-400", border: "border-gray-700" },
                { text: "🟡 DEFCON 2: 45 Mins Left!", style: "text-orange-400 font-extrabold", border: "border-orange-500/50" },
                { text: "🔴 DEFCON 1: DO THIS NOW", style: "text-red-500 font-black animate-bounce", border: "border-red-500 shadow-lg shadow-red-900/20" }
            ];
            
            let currentIdx = 0;
            const interval = setInterval(() => {
                const elementExists = document.getElementById(`defcon-${index}`);
                if (!elementExists) return clearInterval(interval);
                
                defconBadge.innerText = states[currentIdx].text;
                defconBadge.className = `text-xs font-bold px-2 py-1 rounded bg-gray-900 ${states[currentIdx].style}`;
                card.className = `bg-gray-800 p-5 rounded-xl border ${states[currentIdx].border} transition duration-300`;
                
                currentIdx = (currentIdx + 1) % states.length;
            }, 5000); // Cycles every 5 seconds to show your dynamic reminder states cleanly to judges
        }

        // Function to handle autonomous task message drafting
        function triggerAutonomousExecution(taskTitle) {
            const personResponse = prompt("🤖 AI Agent initiating execution. Need an automated email or message draft for this? Type 'yes' to generate:", "yes");
            
            if(personResponse && personResponse.toLowerCase() === 'yes') {
                alert(`Generated high-agency template for "${taskTitle}":\n\n"Hey there, I am currently tracking the progress on ${taskTitle}. Will pass over updates/completion milestones shortly. Thanks for your patience!"`);
            }
        }
    </script>
</body>
</html>
