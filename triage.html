<script>
        document.getElementById('triageBtn').addEventListener('click', async () => {
            const brainDumpText = document.getElementById('brainDump').value;
            const loading = document.getElementById('loading');
            const triageBtn = document.getElementById('triageBtn');
            
            if(!brainDumpText.trim()) {
                alert("Please unload your mental matrix data parameters first!");
                return;
            }

            // Engage loading states visually
            loading.classList.remove('hidden');
            triageBtn.disabled = true;

            try {
                // Call your live backend engine on Port 5000
                const response = await fetch('http://localhost:5000/api/triage', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ brainDump: brainDumpText })
                });
    
                const data = await response.json();
        
                // 1. Fetch any EXISTING tasks stored previously
                let existingData = JSON.parse(localStorage.getItem('triage_data')) || { triage_plan: [] };
        
                // 2. Initialize completion tracking state on the NEW tasks
                data.triage_plan.forEach(task => { 
                    task.completed = false; 
                });
        
                // 3. MERGE the new tasks into the existing array list instead of overwriting!
                existingData.triage_plan = [...existingData.triage_plan, ...data.triage_plan];
        
                // 4. Save the combined accumulative matrix back to cache storage
                localStorage.setItem('triage_data', JSON.stringify(existingData));
        
                // Instantly redirect back to the primary dashboard
                window.location.href = "index.html";
    
            } catch(err) {
                console.error(err);
                alert("Critical Error connecting to structural Gemini endpoint gateway.");
            } finally {
                // This now closes cleanly, allowing formatters to behave perfectly!
                loading.classList.add('hidden');
                triageBtn.disabled = false;
            }
        });
    </script>
