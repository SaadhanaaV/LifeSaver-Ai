<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEFCON Hub | LifeSaver AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .lofi-border { border: 2px solid #3a3a40; }
        .bg-midnight { background-color: #121214; }
        .bg-card-dark { background-color: #1a1a1e; }
        .text-pastel-purple { color: #bca0dc; }
        .text-pastel-pink { color: #f2afcd; }
        .accent-pastel { accent-color: #bca0dc; }
    </style>
</head>
<body class="bg-midnight text-gray-200 min-h-screen font-sans tracking-wide">

    <nav class="bg-card-dark border-b-2 border-[#2b2b30] px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-2">
            <span class="text-2xl">🌙</span>
            <a href="index.html" class="text-xl font-black text-pastel-purple tracking-wider">LIFESAVER AI</a>
        </div>
        <div class="flex gap-6 text-xs font-bold uppercase tracking-widest text-gray-400">
            <a href="index.html" class="hover:text-pastel-purple transition">🏠 Dashboard</a>
            <a href="triage.html" class="hover:text-pastel-purple transition">🧠 Panic Room</a>
            <a href="defcon.html" class="text-pastel-pink border-b border-pastel-pink pb-1">⚠️ DEFCON Hub</a>
            <a href="calendar.html" class="hover:text-pastel-purple transition">📅 Tactical Calendar</a>
            <a href="autonomous.html" class="hover:text-pastel-purple transition">🤖 Agent Execution</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-6 space-y-6 mt-6">
        <div class="flex items-center justify-between border-b border-[#2b2b30] pb-4">
            <div class="flex items-center gap-3">
                <span class="text-2xl text-red-400">🚨</span>
                <h2 class="text-xl font-black uppercase tracking-widest text-red-400">DEFCON Urgency Hub</h2>
            </div>
            <p class="text-xs text-gray-500 font-mono">STATUS: DYNAMIC EVALUATION ACTIVE</p>
        </div>

        <div id="defcon-container" class="space-y-4"></div>
    </main>

    <script>
        function evaluateTimeEscalation() {
            let data = JSON.parse(localStorage.getItem('triage_data')) || { triage_plan: [] };
            let modified = false;

            data.triage_plan.forEach(task => {
                if (task.completed) return;

                if (!task.created_time) {
                    task.created_time = Date.now();
                    modified = true;
                }

                let ageInSeconds = (Date.now() - task.created_time) / 1000;

                // Tasks escalate in priority automatically every 20 seconds for demonstration purposes
                if (ageInSeconds > 20 && task.urgency === 'LOW') {
                    task.urgency = 'MEDIUM';
                    modified = true;
                } else if (ageInSeconds > 40 && task.urgency === 'MEDIUM') {
                    task.urgency = 'HIGH';
                    modified = true;
                } else if (ageInSeconds > 60 && task.urgency === 'HIGH') {
                    task.urgency = 'CRITICAL';
                    modified = true;
                }
            });

            if (modified) {
                localStorage.setItem('triage_data', JSON.stringify(data));
                renderDefconHub();
            }
        }

        function renderDefconHub() {
            const data = JSON.parse(localStorage.getItem('triage_data')) || { triage_plan: [] };
            const container = document.getElementById('defcon-container');
            container.innerHTML = '';

            if (data.triage_plan.length === 0) {
                container.innerHTML = `<div class="text-center py-16 text-gray-500 text-sm">No active alert streams.</div>`;
                return;
            }

            data.triage_plan.forEach((task, idx) => {
                let badgeStyle = 'border-gray-700 bg-gray-800 text-gray-400';
                let alertLabel = '🟢 DEFCON 3: STABLE';
                
                if (task.urgency === 'CRITICAL') {
                    badgeStyle = 'border-red-900 bg-red-950/40 text-red-400 animate-pulse';
                    alertLabel = '🔴 DEFCON 1: IMMEDIATE';
                } else if (task.urgency === 'HIGH') {
                    badgeStyle = 'border-orange-900 bg-orange-950/30 text-orange-400';
                    alertLabel = '🟡 DEFCON 2: ELEVATED';
                } else if (task.urgency === 'MEDIUM') {
                    badgeStyle = 'border-yellow-900/60 bg-yellow-950/20 text-yellow-400';
                    alertLabel = '🔵 DEFCON 3: COLD WATCH';
                }

                const card = document.createElement('div');
                card.className = `bg-card-dark p-5 rounded-xl lofi-border flex items-center justify-between transition gap-4 ${task.completed ? 'opacity-30' : ''}`;
                
                card.innerHTML = `
                    <div class="space-y-2 flex-1">
                        <div class="flex items-center gap-3">
                            <span class="text-[10px] font-black px-2 py-0.5 rounded border tracking-wider uppercase ${badgeStyle}">${alertLabel}</span>
                        </div>
                        <h3 class="text-lg font-bold ${task.completed ? 'line-through text-gray-600' : 'text-gray-100'}">${task.task_title}</h3>
                    </div>
                    <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleDefconTaskState(${idx})" class="w-6 h-6 accent-pastel rounded cursor-pointer">
                `;
                container.appendChild(card);
            });
        }

        function toggleDefconTaskState(idx) {
            let data = JSON.parse(localStorage.getItem('triage_data'));
            data.triage_plan[idx].completed = !data.triage_plan[idx].completed;
            localStorage.setItem('triage_data', JSON.stringify(data));
            renderDefconHub();
        }

        window.onload = () => {
            renderDefconHub();
            setInterval(evaluateTimeEscalation, 3000);
        };
</script>
</body>
</html>
